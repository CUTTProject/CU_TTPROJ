# Two services: MySQL and the Spring Boot app.
#
#   docker compose up --build
#
# Reads secrets from .env in this directory (copy .env.example first). Compose
# passes them straight to the process, so the shell-quoting trap documented in
# docs/REFACTOR.md — where an unquoted `source .env` fails on the '&' in DB_URL
# and silently exports nothing — cannot happen here.
#
# Note: DB_URL from .env is deliberately IGNORED. It points at localhost, which
# is wrong inside the network below; the app must reach Postgres at host `db`.
#
# Postgres rather than MySQL so local development matches the Render deployment
# (Render offers no managed MySQL). Nothing in the code is dialect-specific —
# every repository uses JPQL, so Hibernate generates the right SQL either way.

services:

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: timetable_scheduler
      POSTGRES_USER: timetable
      POSTGRES_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD is not set — copy .env.example to .env}"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      # Exposed so you can inspect the schema with a local client during a demo.
      # Host port 5433 to avoid colliding with a Postgres already running on 5432.
      - "5433:5432"
    healthcheck:
      # `depends_on` alone only waits for the container to START. Postgres needs
      # another few seconds to accept connections, and the app fails fast if it
      # cannot connect — so the app must wait for this to PASS, not just for the
      # container to exist.
      test: ["CMD-SHELL", "pg_isready -U timetable -d timetable_scheduler"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: "jdbc:postgresql://db:5432/timetable_scheduler"
      DB_USERNAME: timetable
      DB_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD is not set — copy .env.example to .env}"
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET is not set — generate one with openssl rand -base64 48}"
      JWT_EXPIRATION: "${JWT_EXPIRATION:-3600s}"
    ports:
      - "8080:8080"

    # ── Resource allocation — read this before changing it ───────────────────
    # The solver's budget is WALL-CLOCK (timetable.solver.time-limit-seconds,
    # default 600), not a work budget:
    #
    #     while (System.nanoTime() < deadlineNanos) { ...ants... }
    #
    # Throttling the container therefore does not make it run longer — it makes
    # it complete FEWER iterations in the same 600 seconds and return a worse
    # timetable, with nothing in the logs to say so. The solver itself is
    # single-threaded; the extra headroom is for GC and the HTTP threads.
    #
    # If you benchmark for the evaluation chapter, report this number alongside
    # the results, or the runs are not reproducible.
    cpus: "2.0"
    mem_limit: 2g

volumes:
  postgres-data:
