spring.application.name=timetable_scheduler

# Local dev secrets, kept out of this file and out of the jar. See local.properties.
# 'optional:' means deployments without the file start normally and read the
# environment instead. Real env vars outrank it, so the .env shell workflow wins.
spring.config.import=optional:file:./local.properties

spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true
spring.devtools.restart.additional-paths=src/main/java,src/main/resources

spring.thymeleaf.cache=false
spring.web.resources.cache.period=0
spring.web.resources.chain.cache=false

# ── MySQL datasource ──────────────────────────────────────────────────────
# Credentials come from the environment. See .env.example; never commit real values.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/timetable_scheduler?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# ── JPA / Hibernate ───────────────────────────────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
# ddl-auto=update is convenient in dev but should not drive a real schema.
# See docs/REFACTOR.md — move to a migration tool (Flyway/Liquibase) before deploying.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha

# ── JWT ───────────────────────────────────────────────────────────────────
# No default: the app must fail to start rather than sign tokens with a known key.
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:3600s}

# ── Timetable solver (MAX-MIN Ant System + min-conflicts local search) ────
# Every value below matches the default in SolverParameters; they are spelled out here so the
# algorithm can be retuned without a rebuild. See docs/TIMETABLE_ALGORITHM_REVIEW.md.

# Wall-clock budget — the spec's Time_Limit. The solver returns its best-so-far when this expires,
# and stops early the moment it proves a conflict-free timetable.
timetable.solver.time-limit-seconds=600

# Ants per iteration: each builds a full timetable, then polishes it with min-conflicts.
timetable.solver.ants=10

# Transition rule weights. alpha = trust in pheromone (learned), beta = trust in the conflict
# count in front of the ant (greedy). beta > alpha on purpose: "don't clash right now" is a strong
# signal for timetabling, and pheromone should refine that rather than overrule it.
timetable.solver.alpha=1.0
timetable.solver.beta=3.0

# rho — pheromone evaporation per iteration. Higher forgets faster and converges sooner.
timetable.solver.evaporation-rate=0.05
timetable.solver.deposit-constant=1.0

# Probability an ant exploits the best-looking candidate outright instead of sampling (ACS rule).
timetable.solver.greedy-selection-probability=0.1

# Candidates weighed per event during construction; 0 = the entire domain (exact, much slower).
timetable.solver.candidate-sample-size=64

# Min-conflicts daemon: steps per ant, and the chance of a random move to escape a plateau.
timetable.solver.local-search-max-steps=20000
timetable.solver.local-search-walk-probability=0.1

# Iterations without improvement before pheromone trails are reset (the global best is kept).
timetable.solver.stagnation-limit=40

# Set a seed to make runs byte-for-byte reproducible — for debugging, benchmarks and demos.
# timetable.solver.seed=42

timetable.solver.verbose=true
