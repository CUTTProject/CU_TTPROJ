spring.application.name=timetable_scheduler

# Local dev secrets, kept out of this file and the jar. 'optional:' lets deployments
# without the file start and read the environment instead; real env vars still win.
spring.config.import=optional:file:./local.properties

spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true
spring.devtools.restart.additional-paths=src/main/java,src/main/resources

spring.thymeleaf.cache=false
spring.web.resources.cache.period=0
spring.web.resources.chain.cache=false

# ── Datasource ────────────────────────────────────────────────────────────
# Credentials come from the environment. See .env.example; never commit real values.
# Either DB_URL (a complete JDBC URL) or DB_HOST/DB_PORT/DB_NAME, which is all
# Render's managed Postgres exposes. DB_URL alone is enough — the parts are only
# resolved when it is absent.
#
# DB_HOST and DB_NAME have no defaults on purpose: a `localhost` fallback let a
# misconfigured deployment start and dial a database inside its own container,
# failing with "Unable to determine Dialect without JDBC metadata", which names
# neither the host nor the missing variable.
#
# Driver and dialect are deliberately unset: Spring picks the driver from the URL
# scheme and Hibernate detects the dialect, so this serves MySQL and Postgres alike.
spring.datasource.url=${DB_URL:jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# ── JPA / Hibernate ───────────────────────────────────────────────────────
# ddl-auto=update suits dev but should not drive a real schema. See docs/REFACTOR.md —
# move to Flyway/Liquibase before deploying.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha

# ── JWT ───────────────────────────────────────────────────────────────────
# No default: fail to start rather than sign tokens with a known key.
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:3600s}

# ── Timetable solver (MAX-MIN Ant System + min-conflicts local search) ────
# Mirrors the defaults in SolverParameters, so the algorithm can be retuned without a
# rebuild. See docs/TIMETABLE_ALGORITHM_REVIEW.md.

# Wall-clock budget (the spec's Time_Limit). Returns its best-so-far on expiry, and stops
# early once a conflict-free timetable is proved.
timetable.solver.time-limit-seconds=600

# Ants per iteration: each builds a full timetable, then polishes it with min-conflicts.
timetable.solver.ants=10

# alpha = trust in pheromone (learned), beta = trust in the conflict count ahead (greedy).
# beta > alpha on purpose: "don't clash now" is a strong signal, and pheromone should refine
# it rather than overrule it.
timetable.solver.alpha=1.0
timetable.solver.beta=3.0

# rho — evaporation per iteration. Higher forgets faster and converges sooner.
timetable.solver.evaporation-rate=0.05
timetable.solver.deposit-constant=1.0

# Chance an ant takes the best-looking candidate outright instead of sampling (ACS rule).
timetable.solver.greedy-selection-probability=0.1

# Candidates weighed per event; 0 = the whole domain (exact, much slower).
timetable.solver.candidate-sample-size=64

# Min-conflicts daemon: steps per ant, and the chance of a random move off a plateau.
timetable.solver.local-search-max-steps=20000
timetable.solver.local-search-walk-probability=0.1

# Iterations without improvement before pheromone trails are reset (the global best is kept).
timetable.solver.stagnation-limit=40

# Set a seed for byte-for-byte reproducible runs.
# timetable.solver.seed=42

timetable.solver.verbose=true

# ── Actuator ──────────────────────────────────────────────────────────────
# Render restarts the instance when this stops answering 200. Only 'health' is exposed
# and without details — the detail view would publish the datasource URL and disk paths
# on an endpoint that must stay unauthenticated. The DB indicator still runs.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never

# ── Server ────────────────────────────────────────────────────────────────
# Render and most PaaS inject the port via PORT; 8080 for local runs and Compose.
server.port=${PORT:8080}

# ── Outbound webhooks ─────────────────────────────────────────────────────
# Results are POSTed to the url each school sets via PUT /api/schools/webhook.
#
# Unlike jwt.secret these deliberately have defaults: a missing secret must stop the app,
# but a missing webhook setting must leave it in the SAFE state.

# Short on purpose: a receiver that cannot be reached quickly is down, not slow.
webhook.connect-timeout=5s
webhook.read-timeout=10s

# Attempts including the first, and the backoff between them: 2s then 8s.
webhook.max-attempts=3
webhook.initial-backoff=2s
webhook.backoff-multiplier=4.0

# MUST stay false in any deployment: the url is school-supplied, so this would expose
# anything reachable from inside the network, including cloud metadata. Localhost testing only.
webhook.allow-private-hosts=${WEBHOOK_ALLOW_PRIVATE_HOSTS:false}

# Dropped, not truncated: a receiver cannot tell a half timetable from a whole one.
webhook.max-payload-bytes=2097152

# The graph is dense in the worst case; past this the payload is capped and flagged.
webhook.max-conflict-map-sections=2000
