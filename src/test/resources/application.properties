# Test overrides. This file shadows src/main/resources/application.properties on the test
# classpath, so tests never need the real MySQL credentials or a real JWT secret.

spring.datasource.url=jdbc:h2:mem:timetable;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

spring.devtools.restart.enabled=false
spring.devtools.livereload.enabled=false

# Test-only signing key. Must still clear the 32-byte HS256 minimum enforced by JwtUtil.
jwt.secret=test-secret-that-is-definitely-long-enough-for-hs256
jwt.expiration=3600s
